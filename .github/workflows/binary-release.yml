name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（手动触发时使用）'
        required: false
        default: 'dev'
      enable_upx:
        description: '是否用 UPX 压缩 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

env:
  QMI_MIRROR: ximineko/quectel-qmi-go
  NETLINK_MIRROR: ximineko/netlink

jobs:
  frontend:
    name: 构建前端资源
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-next/package-lock.json

      # 用 install 而非 ci：lockfile 与 package.json 存在版本不一致，npm ci 会以 EUSAGE 失败
      - name: 安装依赖并构建
        run: |
          npm install --prefix web-next --no-audit --no-fund
          npm run generate --prefix web-next

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-next/.output/public
          if-no-files-found: error
          retention-days: 1

  build:
    name: 构建 ${{ matrix.artifact_arch }}
    needs: frontend
    runs-on: ubuntu-latest
    # RECON_PAT / RECON_REPO 存放在名为 Nyantenna 的 Environment 下，
    # 不声明 environment 的话这两个 secret 会解析成空串（且不会报错）。
    environment: Nyantenna
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact_arch: amd64
          - goarch: arm64
            artifact_arch: arm64
          - goarch: arm
            goarm: '7'
            artifact_arch: armv7
    steps:
      - name: 检出主仓库
        uses: actions/checkout@v4
        with:
          path: nyantenna

      - name: 校验 Environment secret
        env:
          RECON_REPO: ${{ secrets.RECON_REPO }}
          RECON_PAT: ${{ secrets.RECON_PAT }}
        run: |
          : "${RECON_REPO:?为空：请确认 Nyantenna Environment 下已配置 RECON_REPO，且本 job 已声明 environment}"
          : "${RECON_PAT:?为空：请确认 Nyantenna Environment 下已配置 RECON_PAT}"
          echo "✓ Environment secret 已就位"

      - name: 检出 VoWiFi 重构模块（私有）
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.RECON_REPO }}
          token: ${{ secrets.RECON_PAT }}
          path: recon

      - uses: actions/setup-go@v5
        with:
          go-version-file: nyantenna/go.mod
          cache-dependency-path: nyantenna/go.sum

      - name: 配置私有模块拉取
        env:
          RECON_PAT: ${{ secrets.RECON_PAT }}
          QMI_MIRROR: ${{ env.QMI_MIRROR }}
          NETLINK_MIRROR: ${{ env.NETLINK_MIRROR }}
        run: |
          go env -w GOPRIVATE='github.com/iniwex5/*'
          go env -w GONOSUMDB='github.com/iniwex5/*'
          git config --global \
            url."https://x-access-token:${RECON_PAT}@github.com/${QMI_MIRROR}".insteadOf \
            "https://github.com/iniwex5/quectel-qmi-go"
          git config --global \
            url."https://x-access-token:${RECON_PAT}@github.com/${NETLINK_MIRROR}".insteadOf \
            "https://github.com/iniwex5/netlink"

      - name: 接入 VoWiFi 重构模块
        working-directory: nyantenna
        run: |
          go mod edit -replace github.com/iniwex5/vowifi-go=../recon
          go mod tidy
          go list -m github.com/iniwex5/vowifi-go

      - name: 准备版本信息
        id: vars
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version || 'dev' }}"
          fi
          case "${{ github.event.inputs.enable_upx || 'true' }}" in
            false|0|no|off) ENABLE_UPX=0 ;;
            *) ENABLE_UPX=1 ;;
          esac
          {
            echo "version=${VERSION}"
            echo "buildtime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "enable_upx=${ENABLE_UPX}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: nyantenna/web-next/.output/public

      # internal/web 用 //go:embed all:dist 嵌入，必须在 go build 之前就位
      - name: 同步前端资源以供嵌入
        working-directory: nyantenna
        run: |
          rm -rf internal/web/dist
          cp -R web-next/.output/public internal/web/dist

      - name: 编译
        working-directory: nyantenna
        env:
          LDFLAGS_PKG: github.com/ximineko/nyantenna/internal/global
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" \
            -ldflags "-s -w -X '${LDFLAGS_PKG}.Version=${{ steps.vars.outputs.version }}' -X '${LDFLAGS_PKG}.BuildTime=${{ steps.vars.outputs.buildtime }}'" \
            -o dist/nyantenna ./cmd/nyantenna

      - name: UPX 压缩
        if: steps.vars.outputs.enable_upx == '1'
        working-directory: nyantenna
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl || sudo apt-get install -y -qq upx
          upx --best --lzma dist/nyantenna || upx -9 dist/nyantenna || echo "UPX 失败，保留未压缩产物"

      - name: 重命名产物
        working-directory: nyantenna
        run: |
          mkdir -p out
          cp dist/nyantenna "out/nyantenna_${{ steps.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_arch }}
          path: nyantenna/out/*
          if-no-files-found: error
          retention-days: 3

  build-pcsc:
    # PC/SC 需要 cgo。统一在 x86 runner 上交叉编译：
    # 通过 dpkg multiarch 装目标架构的 libpcsclite，再指定交叉 gcc 与 pkg-config 路径。
    name: 构建 ${{ matrix.artifact_arch }} (PC/SC)
    needs: frontend
    runs-on: ubuntu-latest
    environment: Nyantenna
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 为原生构建，不需要 triplet / 交叉 gcc
          - goarch: amd64
            artifact_arch: amd64
          - goarch: arm64
            artifact_arch: arm64
            deb_arch: arm64
            triplet: aarch64-linux-gnu
            cross_pkg: gcc-aarch64-linux-gnu
          - goarch: arm
            goarm: '7'
            artifact_arch: armv7
            deb_arch: armhf
            triplet: arm-linux-gnueabihf
            cross_pkg: gcc-arm-linux-gnueabihf
    steps:
      - name: 检出主仓库
        uses: actions/checkout@v4
        with:
          path: nyantenna

      - name: 校验 Environment secret
        env:
          RECON_REPO: ${{ secrets.RECON_REPO }}
          RECON_PAT: ${{ secrets.RECON_PAT }}
        run: |
          : "${RECON_REPO:?为空：请确认 Nyantenna Environment 下已配置 RECON_REPO，且本 job 已声明 environment}"
          : "${RECON_PAT:?为空：请确认 Nyantenna Environment 下已配置 RECON_PAT}"
          echo "✓ Environment secret 已就位"

      - name: 检出 VoWiFi 重构模块（私有）
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.RECON_REPO }}
          token: ${{ secrets.RECON_PAT }}
          path: recon

      - uses: actions/setup-go@v5
        with:
          go-version-file: nyantenna/go.mod
          cache-dependency-path: nyantenna/go.sum

      # ebfe/scard 用 `#cgo pkg-config: libpcsclite` 链接，交叉编译时必须装上
      # 目标架构的 libpcsclite 开发包，并把 pkg-config 指向该架构的 .pc 目录。
      - name: 安装 PC/SC 开发库
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          TRIPLET: ${{ matrix.triplet }}
          CROSS_PKG: ${{ matrix.cross_pkg }}
        run: |
          set -euo pipefail
          if [ -z "${TRIPLET}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libpcsclite-dev
            exit 0
          fi

          sudo dpkg --add-architecture "${DEB_ARCH}"

          # 所有既有源都必须限定 amd64。archive.ubuntu.com 不含 arm 包，
          # runner 镜像自带的第三方源（microsoft / docker / gh-cli 等）同样只有 amd64；
          # 不限定的话 apt update 会对每个 arm 索引报 404，整条命令随之失败。
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sudo sed -i -E 's|^deb +(\[[^]]*\] *)?|deb [arch=amd64] |' "$f"
          done
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -e "$f" ] || continue
            grep -q '^Architectures:' "$f" || sudo sed -i '/^Types: deb/a Architectures: amd64' "$f"
          done

          # arm 包在 ports.ubuntu.com
          CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          sudo tee "/etc/apt/sources.list.d/ports-${DEB_ARCH}.sources" >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-security
          Components: main universe
          Architectures: ${DEB_ARCH}
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update -qq
          sudo apt-get install -y -qq "${CROSS_PKG}" "libpcsclite-dev:${DEB_ARCH}"
          test -f "/usr/lib/${TRIPLET}/pkgconfig/libpcsclite.pc"
          echo "✓ ${DEB_ARCH} 的 libpcsclite 与 ${CROSS_PKG} 已就位"

      - name: 配置私有模块拉取
        env:
          RECON_PAT: ${{ secrets.RECON_PAT }}
          QMI_MIRROR: ${{ env.QMI_MIRROR }}
          NETLINK_MIRROR: ${{ env.NETLINK_MIRROR }}
        run: |
          go env -w GOPRIVATE='github.com/iniwex5/*'
          go env -w GONOSUMDB='github.com/iniwex5/*'
          git config --global \
            url."https://x-access-token:${RECON_PAT}@github.com/${QMI_MIRROR}".insteadOf \
            "https://github.com/iniwex5/quectel-qmi-go"
          git config --global \
            url."https://x-access-token:${RECON_PAT}@github.com/${NETLINK_MIRROR}".insteadOf \
            "https://github.com/iniwex5/netlink"

      - name: 接入 VoWiFi 重构模块
        working-directory: nyantenna
        run: |
          go mod edit -replace github.com/iniwex5/vowifi-go=../recon
          go mod tidy

      - name: 准备版本信息
        id: vars
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version || 'dev' }}"
          fi
          {
            echo "version=${VERSION}"
            echo "buildtime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: nyantenna/web-next/.output/public

      - name: 同步前端资源以供嵌入
        working-directory: nyantenna
        run: |
          rm -rf internal/web/dist
          cp -R web-next/.output/public internal/web/dist

      # 不做 UPX：cgo 动态链接的产物压缩后容易起不来
      - name: 编译
        working-directory: nyantenna
        env:
          LDFLAGS_PKG: github.com/ximineko/nyantenna/internal/global
          TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          mkdir -p out
          export CGO_ENABLED=1 GOOS=linux
          export GOARCH="${{ matrix.goarch }}" GOARM="${{ matrix.goarm }}"
          if [ -n "${TRIPLET}" ]; then
            export CC="${TRIPLET}-gcc"
            # 用 LIBDIR 而非 PATH：前者会替换默认搜索路径，
            # 避免 pkg-config 回落到宿主 amd64 的 .pc 而链出错架构的库。
            export PKG_CONFIG_LIBDIR="/usr/lib/${TRIPLET}/pkgconfig"
          fi
          go build -trimpath -buildvcs=false -tags "with_utls nomsgpack pcsc" \
            -ldflags "-s -w -X '${LDFLAGS_PKG}.Version=${{ steps.vars.outputs.version }}+pcsc' -X '${LDFLAGS_PKG}.BuildTime=${{ steps.vars.outputs.buildtime }}'" \
            -o "out/nyantenna_${{ steps.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}_pcsc" ./cmd/nyantenna
          file "out/nyantenna_${{ steps.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}_pcsc"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_arch }}-pcsc
          path: nyantenna/out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: 发布 Release
    needs: [build, build-pcsc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 产物说明

            | 文件 | 说明 |
            | --- | --- |
            | `*_linux_amd64` / `arm64` / `armv7` | 静态构建，不含 PC/SC 读卡器支持 |
            | `*_linux_{amd64,arm64,armv7}_pcsc` | 含 PC/SC 支持；动态链接 `libpcsclite`，需宿主已装 `pcscd` 与 CCID 驱动 |

            校验：`sha256sum -c SHA256SUMS`
